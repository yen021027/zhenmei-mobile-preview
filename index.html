const readerCache=new WeakMap();
function pageImage(box,n){
 let cache=readerCache.get(box);
 if(!cache){cache=new Map();readerCache.set(box,cache)}
 if(!cache.has(n)){
   const image=new Image();
   image.src=bookPage(box.dataset.book,n);
   const ready=image.decode().then(()=>image).catch(error=>{cache.delete(n);throw error});
   cache.set(n,ready);
 }
 return cache.get(n);
}
function prepareAdjacent(box,n){

}

async function setBookPage(box,page){
 const id=box.dataset.book,[title,total]=books[id],n=Math.max(1,Math.min(total,page));
 const status=box.querySelector('output'),select=box.querySelector('select');

 select.value=String(n);status.textContent='正在載入第 '+n+' 頁…';
 box.querySelector('[data-step="-1"]').disabled=n===1;
 box.querySelector('[data-step="1"]').disabled=n===total;
 try{
   const img=await pageImage(box,n);
   if(!box.isConnected||box.dataset.turn!==token)return;
   img.alt=title+'電子書，第 '+n+' 頁';
   box.querySelector('img').replaceWith(img);
   box.dataset.page=n;status.textContent='';
   prepareAdjacent(box,n);
 }catch{
   if(box.dataset.turn!==token)return;
   const current=Number(box.dataset.page);
   select.value=String(current);
   box.querySelector('[data-step="-1"]').disabled=current===1;
   box.querySelector('[data-step="1"]').disabled=current===total;
   status.textContent='第 '+n+' 頁載入失敗，請再試一次。';
 }
}

app.addEventListener('toggle',e=>{if(renderedPage==='gallery'&&e.target.matches('details')&&location.hash==='#gallery')rememberGallery()},true);
sections.story[0][1]+=sheet('about','關於振美');
sections.story.push(
 ['人物介紹', [
 ['董事長','翁國振','從基層做起，農人本色的實踐','翁國振十三歲開始在高雄小港種田。農地被徵收後，他轉行與人合建，從工地基層做起，邊做邊學。訪談從這段經歷談起，回看他如何走進建築業。',4,2],
 ['總經理','翁志賢','堅持1.5代的企業家','翁志賢原想出國念書，因家裡需要人手而回到公司。從早年兩戶透天厝的合建經驗，到親自參與經營，他用「1.5 代」形容自己和父親一起打拚的過程。',1,10],
 ['副總經理及執行團隊','林易成','兄弟情誼，是合作的磐石','林易成加入後接手銷售與客戶服務。他在訪談裡談到與總經理的分工，也談為什麼要由熟悉作品的團隊親自向住戶介紹建築。',14,14]
 ].map(([role,name,title,abstract,n,page])=>'<section class="interview-profile"><p class="profile-role">'+role+' · '+name+'</p><h3>'+title+'</h3><p class="profile-abstract">'+abstract+'</p>'+archiveImage('src-character'+n,name+'肖像')+reader('interview',page)+'</section>').join('')],
 ['合作夥伴',sheet('partners','設計團隊',[1,2,3,4,5])+'<h3>材料與設備</h3>'+sheet('partners','合作廠商',[8,9,10,11,12])],
 ['振美大事記',sheet('memorabilia','振美大事記',Array.from({length:12},(_,i)=>i+1))],
 ['聯絡振美',para('高雄市前鎮區中華五路 768 號')+sheet('contact','振美聯絡資訊')]
);
sections.studio[0][1]+= '<h3>工法進化</h3>'+sheet('evolution','工法進化');
const subpages={
 story:{chapter:'about',name:'熱情',lead:0,more:[3]},
 art:{chapter:'about',name:'藝術',lead:1,more:[]},
 approach:{chapter:'about',name:'全方位',lead:2,more:[4,5,6]},
 collection:{chapter:'projects',name:'熱銷'},achievements:{chapter:'projects',name:'業績'},
 studio:{chapter:'craft',name:'工法',lead:0,more:[]},activities:{chapter:'craft',name:'活動',lead:1,more:[]}
};
for(const [id,item] of Object.entries(subpages))labels[id]=labels[item.chapter]+'・'+item.name;
function chapterContent(page){
 const item=subpages[page];
 const tabs=Object.entries(subpages).filter(([,x])=>x.chapter===item.chapter).map(([id,x])=>'<a href="#'+id+'" '+(id===page?'aria-current="page"':'')+'>'+x.name+'</a>').join('');
 const nav='<nav class="subpages" aria-label="'+labels[item.chapter]+'子分頁">'+tabs+'</nav>';
 if(item.chapter==='projects'){
   const card=page==='collection'?link('progress',photo('progress','PROGRESS')+'<span class="collection-name">沐居采　｜　新案預告</span>','tile'):link('gallery',photo('gallerytile','GALLERY')+'<span class="collection-name">歷年作品總表</span>','tile');
   return nav+'<article>'+card+'</article>';
 }
 const rows=sections[item.chapter==='about'?'story':'studio'];
 const more=item.more.map(n=>'<details class="editorial-fold"><summary>'+rows[n][0]+'</summary><div>'+rows[n][1]+'</div></details>').join('');
 return nav+photo(item.chapter,labels[item.chapter],'section-photo')+'<article><h1>'+item.name+'</h1><div class="subpage-lead">'+rows[item.lead][1]+'</div>'+more+'</article>';
}
function render(){clearTimeout(entryTimer);
const page=location.hash.slice(1)||'home',i=chapters.indexOf(page);
document.querySelector('.departing-cover')?.remove();
const outgoing=page==='projects'&&renderedPage==='home'?app.querySelector('.cover'):null;
const coverBounds=outgoing?.getBoundingClientRect();
if(renderedPage==='gallery'&&page!=='gallery'&&(!galleryState||window.scrollY>0))rememberGallery();
const enterChapter=(renderedPage==='about'&&page==='story')||
 (renderedPage==='projects'&&page==='collection')||
 (renderedPage==='craft'&&page==='studio')||
 (app.classList.contains('chapter')&&['story','collection','studio'].includes(page));
document.querySelector('.entry-photo-bridge')?.remove();
document.querySelector('.departing-projects')?.remove();
const returnChapter=i>=0&&subpages[renderedPage]?.chapter===page;
const detailPhoto='.section-photo,.tile img';
const coverPhoto='.scene:not([inert]) .plate';
const source=enterChapter?app.querySelector(coverPhoto):returnChapter?app.querySelector(detailPhoto):null;
const origin=source?.getBoundingClientRect();
const leavingProjects=returnChapter&&page==='projects'?app.querySelector('article'):null;
const leavingTop=leavingProjects?.getBoundingClientRect().top;
const bridge=source?.complete && source.naturalWidth ? source.cloneNode(false) : null;
renderedPage=page;
const currentRail=app.querySelector('.chapter-rail');
if(i>=0&&currentRail){
 currentRail.scrollTo({left:i*currentRail.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
 return;
}
app.className=i>=0?'chapter':!labels[page]?'welcome':'inner';
const back=i>=0?'home':subpages[page]?.chapter||(page==='gallery'?'achievements':'collection');
const bar='<header class="bar">'+iconLink('#'+back,'返回','back')+'<span>振美建設 ｜ '+(labels[page]||'')+'</span>'+iconLink('#home','首頁','home')+'</header>';
if(!labels[page])app.innerHTML='<section class="cover"><small>Reliable and devoted, sincere and relevant, to build the best.</small>'+photo('cover','工地人物油畫','painting','high')+photo('signature','振美建設｜居采公司','signature')+link('projects','進入振美','enter')+'</section>';
else if(i>=0){
 const rail=document.createElement('div');
 rail.className='chapter-rail';
 rail.setAttribute('aria-label','主要章節');
 rail.innerHTML=chapters.map((key,index)=>{
   const dest=['story','collection','studio'][index];
   return '<section class="scene">'+link(dest,photo(key,labels[key],'plate',index===i?'high':'low'),'chapter-entry')+'<div class="story-title"><span class="latin">'+key.toUpperCase()+'</span><h1>'+labels[key]+'</h1><p>'+captions[index]+'</p></div></section>';
 }).join('');
 const tabs=chapters.map(key=>link(key,labels[key])).join('');
 app.innerHTML=bar+'<div class="chapter-stage"><div class="switcher"><p class="hint">點選封面進入　·　左右滑動換章節</p><nav class="tabs" aria-label="主要章節">'+tabs+'</nav></div></div>';
 if(projectImage&&projectImage.complete&&projectImage.naturalWidth){
   const plate=rail.querySelectorAll('.plate')[1];
   projectImage.className=plate.className;projectImage.alt=plate.alt;
   plate.replaceWith(projectImage);
 }
 app.querySelector('.chapter-stage').prepend(rail);
 rail.scrollLeft=i*rail.clientWidth;
 markChapter(i);
 let settle;
 const settled=()=>{
   if(!rail.isConnected||!rail.clientWidth)return;
   const index=Math.round(rail.scrollLeft/rail.clientWidth);
   if(!chapters[index]||Math.abs(rail.scrollLeft-index*rail.clientWidth)>2)return;
   if(!chapters.includes(location.hash.slice(1)))return;
   history.replaceState(null,'','#'+chapters[index]);
   markChapter(index);
 };
 rail.addEventListener('scrollend',settled);
 let visibleIndex=i;
 rail.addEventListener('scroll',()=>{
   if(!rail.clientWidth)return;
   const next=Math.max(0,Math.min(chapters.length-1,Math.round(rail.scrollLeft/rail.clientWidth)));
   if(next!==visibleIndex){
     visibleIndex=next;
     markChapter(next);
   }
   clearTimeout(settle);
   settle=setTimeout(settled,150);
 },{passive:true});
}
else if(subpages[page])app.innerHTML=bar+chapterContent(page);
else if(page==='gallery')app.innerHTML=bar+'<div class="gallery-intro"><h1>歷年作品</h1>'+ picker('選擇建案',[...galleryCases,'經典建案']) +'</div>'+photo('gallery','歷年作品手繪建築與年代紀錄','gallery','high')+'<article id="work-list"><h2 tabindex="-1">作品清單</h2>'+galleryCases.map(galleryFold).join('')+'<details class="editorial-fold"><summary>經典建案</summary>'+sheet('classicworks','經典建案')+'</details>'+'</article>';
else app.innerHTML=bar+'<article class="project-note"><h1>沐居采</h1><p>新案預告，工程進度尚未公布。</p>'+archiveImage('new0','振美新案頁的 Coming Soon 預告')+'</article>';
const select=app.querySelector('.section-picker select');
if(select)select.onchange=()=>{
 if(select.value==='')return;
 const panel=app.querySelectorAll('article > details')[Number(select.value)];
 if(!panel)return;
 panel.open=true;
 const summary=panel.querySelector('summary');summary.focus({preventScroll:true});summary.scrollIntoView({block:'start'});
 select.value='';
};
app.insertAdjacentHTML('beforeend',contacts);
app.classList.toggle('soft-entry',enterChapter);
if(!labels[page]){const cover=app.querySelector('.painting');
projectImage=new Image();projectImage.fetchPriority='high';projectImage.src=photos.projects;
const ready=projectImage.decode().then(()=>true,()=>false);
ready.then(ok=>{if(ok&&cover.isConnected){for(const key of ['about','craft']){const image=new Image();image.fetchPriority='low';image.src=photos[key]}}});
let allowAuto=true;
entryTimer=setTimeout(async()=>{if(await ready&&cover.isConnected&&allowAuto)location.replace('#projects')},5000);
app.querySelector('footer').onfocusin=()=>{allowAuto=false;clearTimeout(entryTimer)}}
document.title=(labels[page]||'首頁')+'｜振美建設';if(page==='gallery'&&galleryState){
 const saved=galleryState;
 app.querySelectorAll('details').forEach((row,index)=>row.open=!!saved.opened[index]);
 window.scrollTo(0,saved.y);
}else window.scrollTo(0,0);
if(outgoing){
 outgoing.classList.add('departing-cover');
 outgoing.inert=true;
 outgoing.setAttribute('aria-hidden','true');
 Object.assign(outgoing.style,{top:coverBounds.top+'px',left:coverBounds.left+'px',width:coverBounds.width+'px',height:coverBounds.height+'px'});
 document.body.append(outgoing);
 const target=app.querySelector('.scene:not([inert]) .plate');
 const reveal=()=>{
   if(!outgoing.isConnected)return;
   const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
   if(!reduced)app.querySelector('.scene:not([inert]) .story-title')?.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:680,delay:250,fill:'backwards',easing:'ease-out'});
   const fade=outgoing.animate([{opacity:1},{opacity:0}],{duration:reduced?260:900,easing:'ease-in-out',fill:'forwards'});
   fade.finished.then(()=>outgoing.remove(),()=>outgoing.remove());
 };
 target.decode().then(reveal,reveal);
}
if(leavingProjects&&origin){
 const stage=app.querySelector('.chapter-stage'),target=app.querySelector(coverPhoto);
 const backdrop=document.createElement('div');
 backdrop.className='inner departing-projects';
 backdrop.inert=true;
 backdrop.setAttribute('aria-hidden','true');
 backdrop.append(leavingProjects);
 leavingProjects.style.marginTop=leavingTop+'px';
 document.body.append(backdrop);
 const bounds=stage.getBoundingClientRect();
 const above=Math.max(0,Math.min(bounds.height,origin.top-bounds.top));
 const below=Math.max(0,Math.min(bounds.height-above,bounds.bottom-origin.bottom));
 stage.classList.add('revealing-projects');
 stage.style.clipPath='inset('+above+'px 0 '+below+'px)';
 const reveal=()=>{
   if(!backdrop.isConnected)return;
   const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
   const frames=reduced?[{opacity:0},{opacity:1}]:[{clipPath:stage.style.clipPath},{clipPath:'inset(0px 0px 0px)'}];
   stage.style.clipPath='';
   const animation=stage.animate(frames,{duration:reduced?180:650,easing:'cubic-bezier(.32,0,.16,1)'});
   const finish=()=>{backdrop.remove();stage.classList.remove('revealing-projects')};
   animation.finished.then(finish,finish);
 };
 target.decode().then(reveal,reveal);
}else if(bridge)transitionPhoto(bridge,origin,app.querySelector(returnChapter?coverPhoto:detailPhoto),returnChapter);
}
function transitionPhoto(bridge,origin,target,returning){
 if(!target)return;
 const bounds=target.getBoundingClientRect();
 bridge.className='entry-photo-bridge';
 bridge.alt='';
 Object.assign(bridge.style,{top:origin.top+'px',left:origin.left+'px',width:origin.width+'px',height:origin.height+'px'});
 document.body.append(bridge);
 if(returning){
   bridge.style.zIndex=1;
   const stage=app.querySelector('.chapter-stage');
   stage.classList.add('returning','opening-cover');
 }
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const motion=bridge.animate([{top:origin.top+'px',height:origin.height+'px'},{top:bounds.top+'px',height:bounds.height+'px'}],{duration:reduced?0:660,easing:'cubic-bezier(.32,0,.16,1)',fill:'forwards'});
 const release=()=>{if(!bridge.isConnected)return;if(returning)app.querySelector('.chapter-stage')?.classList.remove('opening-cover');const fade=bridge.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});fade.finished.then(()=>bridge.remove(),()=>bridge.remove())};
 Promise.all([motion.finished,target.decode()]).then(release,release);
}
function shift(n){const i=chapters.indexOf(location.hash.slice(1));if(i>=0&&chapters[i+n])location.hash=chapters[i+n]}
function markChapter(index){
 const key=chapters[index];
 app.querySelector('.bar > span').textContent='振美建設 ｜ '+labels[key];
 document.title=labels[key]+'｜振美建設';
 app.querySelectorAll('.scene').forEach((scene,n)=>scene.inert=n!==index);
 app.querySelectorAll('.tabs a').forEach((tab,n)=>{if(n===index)tab.setAttribute('aria-current','page');else tab.removeAttribute('aria-current')});
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')shift(-1);if(e.key==='ArrowRight')shift(1)});window.addEventListener('hashchange',render);render();
</script></html>
