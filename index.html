 rail.addEventListener('touchend',event=>{
   const point=event.changedTouches[0];
   if(gesture?.axis==='up'&&gesture.y-point.clientY>55&&gesture.y-point.clientY>Math.abs(point.clientX-gesture.x)*1.3)openVisible();
   gesture=null;
 },{passive:true});
 rail.addEventListener('touchcancel',()=>{gesture=null});
 let wheelDistance=0,lastWheel=0;
 rail.addEventListener('wheel',event=>{
   if(event.ctrlKey||event.deltaY<=0||event.deltaY<=Math.abs(event.deltaX)*1.3)return;
   if(event.cancelable)event.preventDefault();
   if(event.timeStamp-lastWheel>180)wheelDistance=0;
   lastWheel=event.timeStamp;
   wheelDistance+=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1);
   if(wheelDistance>65)openVisible();
 },{passive:false});
 rail.scrollLeft=i*rail.clientWidth;
 markChapter(i);
 let settle;
 const settled=()=>{
   if(!rail.isConnected||!rail.clientWidth)return;
   const index=Math.round(rail.scrollLeft/rail.clientWidth);
   if(!chapters[index]||Math.abs(rail.scrollLeft-index*rail.clientWidth)>2)return;
   if(!chapters.includes(location.hash.slice(1)))return;
   history.replaceState(null,'','#'+chapters[index]);
   markChapter(index);
 };
 rail.addEventListener('scrollend',settled);
 let visibleIndex=i;
 rail.addEventListener('scroll',()=>{
   if(!rail.clientWidth)return;
   const next=Math.max(0,Math.min(chapters.length-1,Math.round(rail.scrollLeft/rail.clientWidth)));
   if(next!==visibleIndex){
     visibleIndex=next;
     markChapter(next);
   }
   clearTimeout(settle);
   settle=setTimeout(settled,150);
 },{passive:true});
}
else if(sections[page]||page==='collection')app.innerHTML=bar+(sections[page]?photo(page==='story'?'about':'craft',labels[page],'section-photo'):'')+chapterContent(page);
else if(page==='gallery')app.innerHTML=bar+photo('gallery','歷年作品手繪建築與年代紀錄','gallery')+'<article><h1>歷年作品</h1>'+galleryCases.map(galleryFold).join('')+'</article>';
else app.innerHTML=bar+'<article>'+photo('progress','PROGRESS 建築細部','progress-hero')+'<h1>沐居采</h1><p>振美的新案頁面目前標示為 Coming Soon，尚未列出沐居采的工程進度。</p>'+archiveImage('new0','振美新案頁的 Coming Soon 預告')+'</article>';
app.insertAdjacentHTML('beforeend',contacts);
app.classList.toggle('soft-entry',enterChapter);
if(!labels[page]){const cover=app.querySelector('.painting');
projectImage=new Image();projectImage.fetchPriority='high';projectImage.src=photos.projects;
const ready=projectImage.decode().then(()=>true,()=>false);
ready.then(ok=>{if(ok&&cover.isConnected){for(const key of ['about','craft']){const image=new Image();image.fetchPriority='low';image.src=photos[key]}}});
let allowAuto=true;
entryTimer=setTimeout(async()=>{if(await ready&&cover.isConnected&&allowAuto)location.replace('#projects')},5000);
app.querySelector('footer').onfocusin=()=>{allowAuto=false;clearTimeout(entryTimer)}}
document.title=(labels[page]||'首頁')+'｜振美建設';if(page==='gallery'&&galleryState){
 const saved=galleryState;
 app.querySelectorAll('details').forEach((row,index)=>row.open=!!saved.opened[index]);
 window.scrollTo(0,saved.y);
}else window.scrollTo(0,0);
if(outgoing){
 outgoing.classList.add('departing-cover');
 outgoing.inert=true;
 outgoing.setAttribute('aria-hidden','true');
 Object.assign(outgoing.style,{top:coverBounds.top+'px',left:coverBounds.left+'px',width:coverBounds.width+'px',height:coverBounds.height+'px'});
 document.body.append(outgoing);
 const target=app.querySelector('.scene:not([inert]) .plate');
 const reveal=()=>{
   if(!outgoing.isConnected)return;
   const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
   if(!reduced)app.querySelector('.scene:not([inert]) .story-title')?.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:680,delay:250,fill:'backwards',easing:'ease-out'});
   const fade=outgoing.animate([{opacity:1},{opacity:0}],{duration:reduced?260:900,easing:'ease-in-out',fill:'forwards'});
   fade.finished.then(()=>outgoing.remove(),()=>outgoing.remove());
 };
 target.decode().then(reveal,reveal);
}
if(leavingProjects&&origin){
 const stage=app.querySelector('.chapter-stage'),target=app.querySelector(coverPhoto);
 const backdrop=document.createElement('div');
 backdrop.className='inner departing-projects';
 backdrop.inert=true;
 backdrop.setAttribute('aria-hidden','true');
 backdrop.append(leavingProjects);
 leavingProjects.style.marginTop=leavingTop+'px';
 document.body.append(backdrop);
 const bounds=stage.getBoundingClientRect();
 const above=Math.max(0,Math.min(bounds.height,origin.top-bounds.top));
 const below=Math.max(0,Math.min(bounds.height-above,bounds.bottom-origin.bottom));
 stage.classList.add('revealing-projects');
 stage.style.clipPath='inset('+above+'px 0 '+below+'px)';
 const reveal=()=>{
   if(!backdrop.isConnected)return;
   const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
   const frames=reduced?[{opacity:0},{opacity:1}]:[{clipPath:stage.style.clipPath},{clipPath:'inset(0px 0px 0px)'}];
   stage.style.clipPath='';
   const animation=stage.animate(frames,{duration:reduced?180:650,easing:'cubic-bezier(.32,0,.16,1)'});
   const finish=()=>{backdrop.remove();stage.classList.remove('revealing-projects')};
   animation.finished.then(finish,finish);
 };
 target.decode().then(reveal,reveal);
}else if(bridge)transitionPhoto(bridge,origin,app.querySelector(returnChapter?coverPhoto:detailPhoto),returnChapter);
}
function transitionPhoto(bridge,origin,target,returning){
 if(!target)return;
 const bounds=target.getBoundingClientRect();
 bridge.className='entry-photo-bridge';
 bridge.alt='';
 Object.assign(bridge.style,{top:origin.top+'px',left:origin.left+'px',width:origin.width+'px',height:origin.height+'px'});
 document.body.append(bridge);
 if(returning){
   bridge.style.zIndex=1;
   const stage=app.querySelector('.chapter-stage');
   stage.classList.add('returning','opening-cover');
 }
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const motion=bridge.animate([{top:origin.top+'px',height:origin.height+'px'},{top:bounds.top+'px',height:bounds.height+'px'}],{duration:reduced?0:660,easing:'cubic-bezier(.32,0,.16,1)',fill:'forwards'});
 const release=()=>{if(!bridge.isConnected)return;if(returning)app.querySelector('.chapter-stage')?.classList.remove('opening-cover');const fade=bridge.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});fade.finished.then(()=>bridge.remove(),()=>bridge.remove())};
 Promise.all([motion.finished,target.decode()]).then(release,release);
}
function shift(n){const i=chapters.indexOf(location.hash.slice(1));if(i>=0&&chapters[i+n])location.hash=chapters[i+n]}
function markChapter(index){
 const key=chapters[index];
 app.querySelector('.bar > span').textContent='振美建設 ｜ '+labels[key];
 document.title=labels[key]+'｜振美建設';
 app.querySelectorAll('.scene').forEach((scene,n)=>scene.inert=n!==index);
 app.querySelectorAll('.tabs a').forEach((tab,n)=>{if(n===index)tab.setAttribute('aria-current','page');else tab.removeAttribute('aria-current')});
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')shift(-1);if(e.key==='ArrowRight')shift(1)});window.addEventListener('hashchange',render);render();
</script></html>
